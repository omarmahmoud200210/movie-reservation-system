<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artillery Load Test Report</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #f8fafc; }
    .subtitle { color: #94a3b8; margin-bottom: 32px; font-size: 0.9rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
    .card .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
    .card .unit { font-size: 0.8rem; color: #64748b; }
    .good { color: #4ade80; }
    .warn { color: #fbbf24; }
    .bad { color: #f87171; }
    .chart-container { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; margin-bottom: 24px; }
    .chart-container h2 { font-size: 1.1rem; margin-bottom: 16px; color: #f1f5f9; }
    canvas { width: 100% !important; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
    td { color: #e2e8f0; }
    .status-badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; }
    .status-2xx { background: #166534; color: #4ade80; }
    .status-4xx { background: #713f12; color: #fbbf24; }
    .status-5xx { background: #7f1d1d; color: #f87171; }
  </style>
</head>
<body>
  <h1>&#128202; Artillery Load Test Report</h1>
  <p class="subtitle">Generated at 7/24/2026, 7:38:55 PM &mdash; 7 sample periods</p>

  <div class="cards">
    <div class="card"><div class="label">Total Requests</div><div class="value">2,640</div></div>
    <div class="card"><div class="label">Median (p50)</div><div class="value good">5<span class="unit"> ms</span></div></div>
    <div class="card"><div class="label">p95</div><div class="value warn">19.9<span class="unit"> ms</span></div></div>
    <div class="card"><div class="label">p99</div><div class="value warn">40.9<span class="unit"> ms</span></div></div>
    <div class="card"><div class="label">Max</div><div class="value bad">174<span class="unit"> ms</span></div></div>
    <div class="card"><div class="label">Error Rate</div><div class="value good">0.00<span class="unit"> %</span></div></div>
  </div>

  <div class="chart-container">
    <h2>Response Time Over Time</h2>
    <canvas id="latencyChart"></canvas>
  </div>

  <div class="chart-container">
    <h2>Throughput &amp; Errors</h2>
    <canvas id="rpsChart"></canvas>
  </div>

  <div class="chart-container">
    <h2>HTTP Status Code Breakdown</h2>
    <table>
      <thead><tr><th>Status</th><th>Count</th><th>Share</th></tr></thead>
      <tbody><tr><td><span class="status-badge status-2xx">200</span></td><td>2,400</td><td>90.9%</td></tr>
<tr><td><span class="status-badge status-2xx">201</span></td><td>240</td><td>9.1%</td></tr></tbody>
    </table>
  </div>

  <script>
    var chartDefaults = {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: { ticks: { color: "#64748b" }, grid: { color: "#1e293b" } },
        y: { ticks: { color: "#64748b" }, grid: { color: "#334155" } }
      },
      plugins: { legend: { labels: { color: "#94a3b8" } } }
    };

    new Chart(document.getElementById("latencyChart"), {
      type: "line",
      data: {
        labels: ["Invalid Date","Invalid Date","Invalid Date","Invalid Date","Invalid Date","Invalid Date","Invalid Date"],
        datasets: [
          { label: "p50", data: [6,5,5,5,5,5,5], borderColor: "#4ade80", borderWidth: 2, fill: false, tension: 0.3 },
          { label: "p95", data: [64.7,19.9,18,21.1,21.1,19.1,19.9], borderColor: "#fbbf24", borderWidth: 2, fill: false, tension: 0.3 },
          { label: "p99", data: [111.1,27.9,22.9,43.4,29.1,29.1,29.1], borderColor: "#f87171", borderWidth: 2, fill: false, tension: 0.3 }
        ]
      },
      options: Object.assign({}, chartDefaults, { scales: { x: chartDefaults.scales.x, y: Object.assign({}, chartDefaults.scales.y, { title: { display: true, text: "ms", color: "#94a3b8" } }) } })
    });

    new Chart(document.getElementById("rpsChart"), {
      type: "bar",
      data: {
        labels: ["Invalid Date","Invalid Date","Invalid Date","Invalid Date","Invalid Date","Invalid Date","Invalid Date"],
        datasets: [
          { label: "Successful (2xx)", data: [125,440,431,444,444,440,316], backgroundColor: "#166534", borderRadius: 4 },
          { label: "Errors", data: [0,0,0,0,0,0,0], backgroundColor: "#7f1d1d", borderRadius: 4 }
        ]
      },
      options: Object.assign({}, chartDefaults, { scales: { x: Object.assign({}, chartDefaults.scales.x, { stacked: true }), y: Object.assign({}, chartDefaults.scales.y, { stacked: true, title: { display: true, text: "requests", color: "#94a3b8" } }) } })
    });
  </script>
</body>
</html>
