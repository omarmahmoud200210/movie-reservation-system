services:
  redis-cache:
    image: redis:7
    ports:
      - '127.0.0.1:6379:6379'
    command:
      [
        'redis-server',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'allkeys-lfu',
      ]
    volumes:
      - D:/docker/redis/data:/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: '[PASSWORD]'
      DB_NAME: moviereservationsystem
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000 # Allows thousands of app connections
      DEFAULT_POOL_SIZE: 50 # Pools them into 50 actual Postgres connections
      SERVER_RESET_QUERY: DISCARD ALL
    ports:
      - '127.0.0.1:6432:5432'
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '[PASSWORD]'
      POSTGRES_DB: moviereservationsystem
    command:
      - 'postgres'
      # Connection Limits
      - '-c'
      - 'max_connections=200' # Do not inflate; use PgBouncer for client pool
      # Memory Configuration (Tuned for ~8GB dedicated RAM)
      - '-c'
      - 'shared_buffers=2GB' # ~25% of system RAM
      - '-c'
      - 'effective_cache_size=6GB' # ~75% of total system RAM
      - '-c'
      - 'work_mem=32MB' # Memory for sort/hash operations per query
      - '-c'
      - 'maintenance_work_mem=512MB' # Speeds up INDEX creation and VACUUM
      # WAL & Checkpoint Tuning (High Write Performance)
      - '-c'
      - 'wal_buffers=16MB'
      - '-c'
      - 'checkpoint_completion_target=0.9' # Smooths I/O load during checkpoints
      - '-c'
      - 'min_wal_size=1GB'
      - '-c'
      - 'max_wal_size=8GB' # Reduces frequent checkpoint disk flushes
      # Query Planner Tuning for SSD/NVMe Storage
      - '-c'
      - 'random_page_cost=1.1' # Tells planner fast random access is available
      - '-c'
      - 'effective_io_concurrency=200' # Allows parallel disk reads on SSD/NVMe
      # Background Writer Tuning
      - '-c'
      - 'bgwriter_delay=20ms'
      - '-c'
      - 'bgwriter_lru_maxpages=800'
    volumes:
      - D:/docker/postgres/db_data:/var/lib/postgresql/data
