global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'movie-reservation-backend'
    static_configs:
      # host.docker.internal: this repo's NestJS app runs on the host
      # (npm run start:dev), not inside this compose network.
      - targets: ['host.docker.internal:3000']
    metrics_path: /metrics
